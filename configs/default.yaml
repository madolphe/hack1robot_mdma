model: google/gemma-3-12b-it
lens:
  repo: neuronpedia/jacobian-lens
  file: gemma-3-12b-it/jlens/Salesforce-wikitext/gemma-3-12b-it_jacobian_lens.pt
input:
  phrases:
    - "Le silence est-il une forme de langage ?"
    - "Que reste-t-il d'un souvenir quand on l'oublie ?"
    - "Une machine peut-elle rêver ?"
  phrase_index: 0
  system: "Tu dissertes longuement et librement sur le sujet donné."
generation: {max_new_tokens: 600, temperature: 0.8, top_p: 0.95, seed: 1, repetition_penalty: 1.0}  # >1 : pénalise les tokens déjà écrits
readout:
  band: [0.38, 0.92]
  top_k: 50
  min_len: 3
  filter_before_topk: false   # false = top-k sur tout le vocabulaire puis filtrage (spec)
  layer_weights: null         # null = poids 1 ; sinon liste alignée sur les couches de la bande
  exclure_echos: {enabled: true, last_n_tokens: 32}
  stopwords_extra: []
  # h et J @ h de chaque token dans runs/<id>/jspace.pt (introspect/jspace.py) ; layers: all (lentille entière) ou band
  save_jspace: {enabled: false, layers: all}
  # retirer de la lecture la drogue injectée aux couches précédentes (elle reste dans le flux résiduel et la lentille
  # la relirait) : on lit la réaction du modèle, pas la poussée. false = lecture brute (runs d'avant le 21/11)
  subtract_injection: true
windows: {size: 24, stride: 8, top_m: 12, decay: 0.0}
drugs: []
#  - {word: ocean, alpha: 0.002, band: [0.45, 0.70], profile: ramp, start: 100, end: 400, period: 40, on_prompt: false}
image:
  model: Tongyi-MAI/Z-Image-Turbo
  size: [1344, 768]
  steps: 8
  strength: 0.7               # spec : 0.55 ; 0.55 restait bloqué sur la 1re composition
  reset_every: 8              # t2i pur toutes les 8 tranches
  prompt_words: 6
  # spec : "{words}, {style}" (liste brute) -> Z-Image dessine les mots en lettres ; gabarit "métaphore" par défaut
  prompt_template: "A surreal dreamlike oil painting, a visual metaphor of {words}. {style}"
  intermediates: 0
  repeat_top: 0
  retry_letterbox: 3          # image à bandes noires en haut et en bas : jusqu'à 3 nouvelles graines
  state_styles: false         # drogue par états : ajouter au prompt le style visuel de l'état de la tranche (states.yaml)
  seed: 1
  style: "Diffuse light, soft haze, rich colors, painterly brushstrokes, cinematic composition"
voice: {engine: kokoro, n_voices: 1, voice: ff_siwis, voice_en: af_heart, english_voice: false, speed: 0.9, mode: new_words, polyphony: false, gap_s: 0.25}
sound:
  mode: voix            # voix | sonorisation | mixte
  features: {lexicons: [lancaster, nrc_vad, concreteness], fallback: embeddings, embed_model: sentence-transformers/paraphrase-multilingual-mpnet-base-v2}
  voice_fx: {enabled: true, engine: pedalboard}
  sono:
    layer_a: {enabled: true, model: stabilityai/stable-audio-open-1.0, suffix: "ambient texture, drone, field recording", steps: 100}
    layer_b: {enabled: true, sample_rate: 44100}
    segments: slice      # slice : un clip par tranche ; phase : nappe continue par phase de drogue (≤ segment_max_s)
  duck_db: -6
  duck_smooth_s: 0.15    # lissage de l'enveloppe de la voix pour baisser la nappe
  drug_fx: 1.0           # force des effets « drogués » du son (voix et nappe), 1 = pleine force au niveau 4
  loudness_db: null      # niveau moyen visé du mixage (dBFS RMS, crêtes limitées) ; null = crête à 0,9 seulement
video:
  fps: 30
  min_duration_s: 2.0
  crossfade_s: 0.8
  width: 1920
  height: 1080
  target_duration_s: 60     # durée globale visée (approx.) ; null = une tranche tous les windows.stride tokens
  slice_target_s: 3.0       # durée visée par tranche quand target_duration_s est fixé
  fit_target: false         # true : resserrer aussi une vidéo plus longue que la cible (les voix débordent sur l'image suivante)
