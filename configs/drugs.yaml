    # Même voyage, mais chaque phase pousse un état (configs/states.yaml) au lieu de mots : vecteurs extraits par
    # ./run.sh py states extract, dose α choisie par ./run.sh py states sweep ; `dose` en multiple de cet α.
    # 0,75 : sur Qwen3.5-4B, l'α du balayage (0,08, réponses courtes en anglais) fait boucler une dissertation de
    # 200 tokens en français pendant la dissolution ; 0,75 (α 0,06) reste lisible, 0,5 est discret.
    label: LSD (états)
    phases:
      - {name: Pic sensoriel, start: 0.00, end: 0.40, state: synesthesia, dose: 0.75}
