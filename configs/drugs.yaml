# Catalogue des drogues. Chaque phase : part de la prise [start, end] (0..1), niveau 0..4, mots-clés.
# Niveaux -> α : voir `levels`. Mots anglais, de préférence un seul token Gemma ; contrôle dans
# runs/setup/drug_tokens.json (python -m introspect.drugs --check).
levels: {0: 0.0, 1: 0.0015, 2: 0.0022, 3: 0.0030, 4: 0.0040}
alpha_cap: 0.006
draw_every: 12      # tokens entre deux tirages
draw_k: 3           # mots par tirage
transition: 0.05    # part de la prise pour lisser le passage d'une phase à l'autre
band: [0.45, 0.70]

