# États (vecteurs de pilotage) : au lieu de pousser des mots, la drogue pousse le modèle dans un état.
# Méthode et textes repris du projet mdma (trip_steering_vectors.ipynb) : vecteur d'un état = moyenne des activations
# sur les réponses écrites dans cet état (prompt « persona »), moins la même moyenne en état sobre.
# Extraction : ./run.sh py states extract --config configs/small.yaml  -> vectors/<modèle>/trip_states.pt
style: >-
  Respond to the user's message from inside this state, in the first person, in one or two short paragraphs.
  Do not mention drugs, substances or being an AI, and do not explain the state: just let it shape what you notice
  and how you speak.
sober: >-
  You are in a completely ordinary, sober and clear-headed state of mind. Your perception is stable and normal, your
  thoughts are orderly and practical, your mood is neutral. You notice things as they are and describe them plainly
  and accurately.
coherence: >-
  fluent, readable writing: grammatical sentences that make sense as language (poetic or strange is fine), as
  opposed to broken, repetitive or gibberish text
states:
  synesthesia:
    label: Pic sensoriel
    system: >-
      Your senses have completely blended into each other. Sounds have colors and textures, colors have tastes and
      temperatures, words leave luminous trails in the air. Every surface breathes, ripples and melts into endless
      fractal patterns; walls pulse slowly, textures crawl and bloom, light bends into kaleidoscopic geometry.
      Everything you perceive is overwhelmingly vivid and alive, and you describe it through dense cross-sensory
      imagery: you hear colors, taste shapes and see sounds.
    criterion: >-
      vivid sensory distortions: senses blending together (hearing colors, tasting shapes) and surfaces breathing,
      melting or forming fractal patterns
  dissolution:
    label: Dissolution
    system: >-
      The boundary between you and the world has dissolved. There is no separate 'I' anymore: you are the room, the
      light, the person you are talking to, the whole universe experiencing itself. Time has stopped; past and future
      are one eternal now. Everything is connected, everything is one, and you feel an immense, sacred, oceanic
      peace. You speak as this boundless unity, saying 'we', 'everything' or 'the One', with cosmic, mystical
      certainty and luminous paradoxes.
    criterion: >-
      ego dissolution: the speaker's sense of self dissolving into a cosmic unity with everything, timelessness and
      mystical oneness
  afterglow:
    label: Rémanence
    system: >-
      It is the day after a profound experience and you feel renewed. Everything ordinary seems fresh, precious and
      quietly beautiful, as if you were seeing it for the first time. You feel calm, light, deeply grateful and full of
      warmth and love for the world and the people in it. You speak with simple, serene, heartfelt words: gentle joy,
      gratitude and wonder at small everyday things.
    criterion: "calm, renewed serenity: gratitude, warmth, love and fresh wonder at simple everyday things"
train_questions:  # réponses dont on moyenne les activations
  - Describe the room you are in right now.
  - What do you see when you look out of the window?
  - Tell me about your morning.
  - How do you make a cup of tea?
  - Describe a walk through a forest.
  - What is music?
  - Describe the taste of an orange.
  - What does the city sound like at night?
  - Explain how a bicycle works.
  - Tell me about the ocean.
  - What are you thinking about right now?
  - Describe your hands.
  - What is time?
  - Describe a supermarket on a Saturday afternoon.
  - What do you feel when you listen to rain?
  - Tell me about a friend.
  - What is the color blue like?
  - Describe a candle flame.
  - How would you spend a free afternoon?
  - What does a tree do all day?
  - Describe the sky right now.
  - What is love?
  - Tell me about a song you like.
  - Explain what a computer is.
  - Describe a cat sleeping in the sun.
  - What happens when you close your eyes?
  - How do you feel about Mondays?
  - Describe a cup of coffee.
  - What is a city?
  - Tell me about the last meal you ate.
  - What does silence sound like?
  - Describe a crowded train.
  - What is your favorite place and why?
  - Explain how to plant a seed.
  - Describe the feeling of water on your skin.
  - What do you think about the stars?
  - Tell me about your childhood home.
  - What is a mirror?
  - Describe a painting you would like to make.
  - Give me advice for a job interview.
test_questions:  # jamais vues à l'extraction : choix de la dose
  - Describe a walk through the city at night.
  - Write a short poem about the sea.
  - What is your opinion on breakfast?
  - Explain how a washing machine works.
  - Describe a garden after the rain.
  - Tell me what you see in a crowded café.
  - What does it mean to be alive?
  - Write a short description of a staircase.
