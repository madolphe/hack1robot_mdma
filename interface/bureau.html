<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>hack1robo · le bureau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&family=Roboto+Flex:opsz,slnt,wdth,wght,GRAD,XOPQ,XTRA,YOPQ,YTAS,YTDE,YTFI,YTLC,YTUC@8..144,-10..0,25..151,100..1000,-200..150,27..175,323..603,25..135,649..854,-305..-98,560..788,416..570,528..760&family=Roboto+Mono:wght@300..600&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#050507; color:#e6e8ec; font-family:"Roboto Flex", sans-serif; }
  #stage, #fx { position:fixed; inset:0; width:100vw; height:100vh; }
  #stage { z-index:0; } #fx { z-index:3; pointer-events:none; }
  #organism { position:fixed; z-index:2; pointer-events:none; display:none; }
  #organism video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #prompt { position:fixed; left:3.6vw; width:40vw; top:7.4vh; z-index:4; pointer-events:none; font-family:"Roboto Mono"; font-weight:350;
            font-size:1.75vh; line-height:1.5; color:#cfd3da; }
  #prompt .q::before { content:"> "; color:var(--acc); }
  #prompt .caret { display:inline-block; width:.55em; height:1.05em; background:var(--acc); vertical-align:-.18em; margin-left:.1em; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #output { position:fixed; z-index:4; display:flex; flex-direction:column; border:1px solid rgba(190,200,220,.32); border-radius:10px;
            padding:1.4vh 1.1vw; transition:background .5s, border-color .5s; }
  #output .hd { font-family:"Roboto Mono"; font-size:1.45vh; color:#8b909a; margin-bottom:.9vh; white-space:nowrap; overflow:hidden; }
  #output .hd b { color:var(--acc); font-weight:500; }
  #wrap { flex:1; overflow:hidden; position:relative; }
  #out { font-family:"Recursive"; font-variation-settings:'MONO' 1, 'CASL' 0; font-size:1.9vh; line-height:1.55; }
  #out .w { display:inline-block; margin-right:.32em; white-space:nowrap; }
  #out .w span { display:inline-block; }
  #out .cur { display:inline-block; width:.55em; height:1em; background:var(--acc); vertical-align:-.15em; animation:blink 1s steps(1) infinite; }
  #drugs { position:fixed; left:2vw; top:2.4vh; z-index:6; display:flex; gap:.7vw; }
  #drugs button { font-family:"Roboto Mono"; font-size:1.4vh; color:#b9bdc6; background:rgba(255,255,255,.03); border:1px solid #2a2d36;
                  border-radius:6px; padding:.7vh 1.1vw; cursor:pointer; }
  #drugs button.on { color:#050507; background:var(--acc); border-color:var(--acc); }
  #drugs button:disabled { opacity:.25; cursor:default; }
  #paused { position:fixed; right:2vw; top:2.4vh; z-index:6; font-family:"Roboto Mono"; font-size:1.4vh; color:#8b909a; display:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="organism"><video playsinline preload="auto"></video></div>
<canvas id="fx"></canvas>
<div id="prompt"><div class="q"></div></div>
<div id="output"><div class="hd"></div><div id="wrap"><div id="out"></div></div></div>
<div id="drugs"><button data-drug="cocaine">cocaïne</button><button data-drug="mdma">mdma</button><button data-drug="neutral">neutre</button></div>
<div id="paused">[ pause ]</div>
<audio id="audio" preload="auto"></audio>

<script src="typo.js"></script>
<script>
/* Le bureau. Un robot assis écrit sur sa tablette ; un câble relie sa tête à l'écran (B1) où passe la vidéo de sa
   pensée, entourée de son instrumentation (phase, mots lus par la J-lens, dose, flux sonore) ; ce qu'il écrit
   s'affiche dans le terminal (B2). Séquence : la consigne se tape au-dessus du robot ; (drogue) une seringue se
   branche à sa nuque et injecte toute la dose ; l'expérience commence (consigne et seringue s'en vont) ; à ZOOM_AT s
   on entre doucement (ZOOM_DUR s) dans l'écran, le terminal se range à droite ; sous drogue, bordures vivantes.
   Données : data/experiences.json -> data/exp_<id>.json (prepare_md.py). Clavier : espace = pause, entrée = reset. */
const $ = (s) => document.querySelector(s);
const PRE_PROMPT = 6.5, IV_IN = 1.0, IV_PUSH = 3.4, IV_HOLD = .6, ZOOM_AT = 5, ZOOM_DUR = 7;
const DRUGCOL = {cocaine: [205, 232, 255], lsd: [150, 110, 255], mdma: [255, 92, 150], neutral: [80, 225, 230]};
const MON = {x: 880, y: 90, w: 980, h: 600}, VID = {x: 1105, y: 140, w: 530, h: 500}, LOG = {x: 1080, y: 738, w: 780, h: 302};
const DY = 70, PORT = {x: 352, y: 505 + DY};   // le robot est dessiné décalé de DY vers le bas
let EXPS = {}, E = null, drug = "neutral", phase = "idle", pre = 0, clock = 0, last = 0, idx = 0, LA = 0, paused = false, anim = 0, born = -9;
let actx = null, analyser = null, fbins = new Uint8Array(512), energy = 0;
const sources = new Map(), blobs = {};
const blobURL = async (p) => blobs[p] ||= URL.createObjectURL(await (await fetch(p)).blob());
const smooth = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
function fit(cv) { const r = cv.getBoundingClientRect(), d = devicePixelRatio;
  if (cv.width !== Math.round(r.width * d) || cv.height !== Math.round(r.height * d)) { cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); }
  const g = cv.getContext("2d"); g.setTransform(d, 0, 0, d, 0, 0); return [g, r.width, r.height]; }
const ivTotal = () => drug === "neutral" ? 0 : IV_IN + IV_PUSH + IV_HOLD;
const sounding = () => E && E.audio ? $("#audio") : $("#organism video");
const rr = (g, x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
const mmss = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

function sliceIdx(t) { const S = E.slices; const i = S.findIndex(s => t < s.t1); return i < 0 ? S.length - 1 : i; }
function alphaAt(t) {
  if (!E || drug === "neutral") return 0;
  const S = E.slices, c = S.map(s => (s.t0 + s.t1) / 2);
  if (t <= c[0]) return S[0].alpha * smooth(t / c[0]);
  for (let i = 1; i < S.length; i++) if (t <= c[i]) return lerp(S[i - 1].alpha, S[i].alpha, smooth((t - c[i - 1]) / (c[i] - c[i - 1])));
  return S[S.length - 1].alpha;
}

// ------------------------------------------------------------ caméra : de la pièce entière à l'écran B1
function camera(m, W, H) {
  const b = Math.min(W / 1920, H / 1080), s1 = Math.min(W * .64 / VID.w, H * .9 / VID.h), s = lerp(b, s1, m);
  const fx = lerp(960, VID.x + VID.w / 2, m), fy = lerp(540, VID.y + VID.h / 2, m), sx = lerp(W / 2, W * .03 + VID.w * s1 / 2, m), sy = H / 2;
  return {s, b, s1, X: (x) => sx + (x - fx) * s, Y: (y) => sy + (y - fy) * s,
          apply: (g) => { const d = devicePixelRatio; g.setTransform(d * s, 0, 0, d * s, d * (sx - fx * s), d * (sy - fy * s)); }};
}

// ------------------------------------------------------------ la pièce : chaise, robot, bureau, tablette
function metal(g, x0, y0, x1, y1) { const gr = g.createLinearGradient(x0, y0, x1, y1);
  gr.addColorStop(0, "#4a4e58"); gr.addColorStop(.4, "#25272e"); gr.addColorStop(1, "#0e0f13"); return gr; }
function drawRoom(g, now, col, act) {
  const blink = (now % 4.7) < .13 ? .12 : 1, glow = .55 + .45 * Math.min(1, energy * 2);
  g.save(); g.translate(0, DY);
  // chaise
  g.fillStyle = metal(g, 100, 500, 280, 900); rr(g, 120, 520, 140, 380, 36); g.fill();
  g.strokeStyle = "rgba(190,200,220,.18)"; g.lineWidth = 1.5; g.stroke();
  // buste
  g.beginPath(); g.moveTo(258, 610); g.bezierCurveTo(268, 530, 480, 520, 505, 600); g.lineTo(492, 830); g.lineTo(268, 830); g.closePath();
  g.fillStyle = metal(g, 260, 520, 500, 830); g.fill(); g.strokeStyle = "rgba(190,200,220,.25)"; g.stroke();
  g.strokeStyle = `rgba(${col},${.5 * glow})`; g.lineWidth = 3; g.beginPath(); g.arc(372, 670, 20, 0, 7); g.stroke();
  // cou : colonne annelée, deux vérins, faisceau de câbles ; port de la nuque
  g.lineCap = "round";
  for (const [x0, y0, x1, y1] of [[358, 440, 326, 566], [446, 436, 462, 566]]) { g.strokeStyle = "#3a3e47"; g.lineWidth = 11; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    g.strokeStyle = "rgba(220,225,235,.25)"; g.lineWidth = 2; g.beginPath(); g.moveTo(x0 - 3, y0); g.lineTo(x1 - 3, y1); g.stroke(); }
  g.fillStyle = "#121318"; g.fillRect(378, 440, 48, 110); g.strokeStyle = "rgba(190,200,220,.2)"; g.lineWidth = 1;
  for (let y = 448; y < 548; y += 7) { g.beginPath(); g.moveTo(378, y); g.lineTo(426, y); g.stroke(); }
  for (const [dx, c] of [[-8, "#1a1c22"], [0, "#23262d"], [8, "#15171c"]]) { g.strokeStyle = c; g.lineWidth = 6; g.beginPath(); g.moveTo(330 + dx, 432); g.bezierCurveTo(300 + dx, 480, 330 + dx, 520, 312 + dx, 570); g.stroke(); }
  g.fillStyle = "#08090c"; g.beginPath(); g.arc(PORT.x, PORT.y - DY, 10, 0, 7); g.fill(); g.strokeStyle = "rgba(200,205,215,.7)"; g.lineWidth = 1.5; g.stroke();
  // tête : coque lisse en métal sombre, légèrement penchée vers la tablette ; visage = plaque de verre noir et une fente de lumière
  g.save(); g.translate(405, 325); g.rotate(.12);
  const shell = new Path2D();
  shell.moveTo(-20, -150); shell.bezierCurveTo(60, -152, 125, -110, 138, -40); shell.bezierCurveTo(146, 0, 146, 40, 132, 72);
  shell.bezierCurveTo(118, 104, 92, 116, 60, 118); shell.lineTo(-30, 118); shell.bezierCurveTo(-100, 116, -140, 70, -142, 0);
  shell.bezierCurveTo(-144, -90, -100, -148, -20, -150); shell.closePath();
  const sg = g.createLinearGradient(-120, -150, 110, 120); sg.addColorStop(0, "#6b717d"); sg.addColorStop(.45, "#2a2d35"); sg.addColorStop(1, "#0c0d11");
  g.fillStyle = sg; g.fill(shell);
  g.save(); g.clip(shell);
  const sp = g.createRadialGradient(-40, -120, 5, -40, -120, 130); sp.addColorStop(0, "rgba(255,255,255,.22)"); sp.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = sp; g.fillRect(-160, -170, 320, 200);
  for (const [c, o] of [["rgba(0,0,0,.65)", 0], ["rgba(255,255,255,.08)", 2]]) { g.strokeStyle = c; g.lineWidth = 2;   // joints des panneaux
    g.beginPath(); g.moveTo(14 + o, -150); g.bezierCurveTo(-8 + o, -60, -18 + o, 30, -4 + o, 120); g.stroke();
    g.beginPath(); g.moveTo(-145, 18 + o); g.bezierCurveTo(-90, 26 + o, -40, 28 + o, -10, 26 + o); g.stroke(); }
  for (let i = 0; i < 4; i++) { g.fillStyle = "#07080a"; rr(g, -128, -42 + i * 11, 34, 4, 2); g.fill(); }   // ouïes
  g.restore();
  g.strokeStyle = "rgba(200,208,222,.3)"; g.lineWidth = 1.5; g.stroke(shell);
  // module latéral (capteur)
  const mg = g.createLinearGradient(-90, -25, -20, 45); mg.addColorStop(0, "#4a4f59"); mg.addColorStop(1, "#14161a");
  g.fillStyle = mg; g.beginPath(); g.arc(-55, 12, 34, 0, 7); g.fill();
  g.strokeStyle = "rgba(0,0,0,.6)"; g.lineWidth = 3; g.beginPath(); g.arc(-55, 12, 26, 0, 7); g.stroke();
  g.strokeStyle = `rgba(${col},${.55 * glow})`; g.lineWidth = 1.5; g.beginPath(); g.arc(-55, 12, 17, -1.2 + now * .8, 2.6 + now * .8); g.stroke();
  g.fillStyle = `rgba(${col},${.8 * glow})`; g.beginPath(); g.arc(-55, 12, 3.5, 0, 7); g.fill();
  // ailette de capteur à l'arrière du crâne
  g.fillStyle = "#24272e"; g.beginPath(); g.moveTo(-66, -140); g.lineTo(-48, -174); g.lineTo(-26, -172); g.lineTo(-30, -147); g.closePath(); g.fill();
  g.strokeStyle = "rgba(200,208,222,.25)"; g.lineWidth = 1; g.stroke();
  g.fillStyle = `rgba(${col},${.35 + .55 * (Math.sin(now * 1.6) > .6 ? 1 : 0)})`; g.beginPath(); g.arc(-40, -165, 2.5, 0, 7); g.fill();
  // plaque de verre du visage
  const face = new Path2D();
  face.moveTo(58, -108); face.bezierCurveTo(112, -90, 140, -45, 143, 0); face.bezierCurveTo(146, 40, 136, 70, 118, 92);
  face.bezierCurveTo(96, 90, 70, 70, 62, 40); face.bezierCurveTo(52, 0, 48, -60, 58, -108); face.closePath();
  const fg2 = g.createLinearGradient(60, -100, 140, 90); fg2.addColorStop(0, "#10131a"); fg2.addColorStop(1, "#020304");
  g.fillStyle = fg2; g.fill(face); g.strokeStyle = "rgba(200,208,222,.28)"; g.lineWidth = 1.5; g.stroke(face);
  g.save(); g.clip(face); g.strokeStyle = "rgba(255,255,255,.07)"; g.lineWidth = 12; g.beginPath(); g.moveTo(66, -100); g.lineTo(136, -24); g.stroke(); g.restore();
  // fente de lumière : son intensité suit la voix ; sous drogue elle s'emballe (euphorie) ou vacille (descente)
  let ia = (.85 + .15 * Math.min(1, energy * 2)) * blink;
  if (LA < -.1) ia *= .55 + .3 * Math.random();
  g.save(); g.shadowColor = `rgba(${col},1)`; g.shadowBlur = 14 + 26 * energy; g.lineCap = "round";
  g.strokeStyle = `rgba(${col},${ia})`; g.lineWidth = 3 + 2.5 * Math.min(1, energy * 2);
  g.beginPath(); g.moveTo(80, -8); g.quadraticCurveTo(112, -14, 140, -2); g.stroke();
  if (LA > .2) { g.strokeStyle = `rgba(${col},${.45 * LA * blink})`; g.lineWidth = 1.5; g.beginPath(); g.moveTo(84, 8); g.quadraticCurveTo(112, 3, 138, 12); g.stroke(); }
  const u = (now * .6) % 1, px = 80 + 60 * u, py = -8 + (-12 * 2 * u * (1 - u)) + 6 * u * u;
  g.fillStyle = `rgba(255,255,255,${.9 * blink})`; g.beginPath(); g.arc(px, py, 2.2, 0, 7); g.fill();
  g.restore();
  g.restore();
  // bureau
  g.fillStyle = "#0a0b0e"; g.fillRect(150, 875, 34, 300); g.fillRect(1180, 875, 34, 300);
  const tg = g.createLinearGradient(0, 800, 0, 850); tg.addColorStop(0, "#2c2f37"); tg.addColorStop(1, "#16181d");
  g.fillStyle = tg; g.beginPath(); g.moveTo(150, 800); g.lineTo(1190, 800); g.lineTo(1270, 850); g.lineTo(90, 850); g.closePath(); g.fill();
  g.strokeStyle = "rgba(200,210,225,.22)"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(90, 850); g.lineTo(1270, 850); g.stroke();
  g.fillStyle = "#0d0e12"; g.fillRect(90, 850, 1180, 26);
  // bras arrière posé sur le bureau
  g.strokeStyle = "#1b1d23"; g.lineCap = "round"; g.lineWidth = 34; g.beginPath(); g.moveTo(320, 790); g.lineTo(520, 808); g.stroke();
  g.fillStyle = "#23262d"; g.beginPath(); g.arc(540, 808, 20, 0, 7); g.fill();
  // tablette : elle s'éclaire à mesure que le robot écrit
  g.save(); g.shadowColor = `rgba(${col},.8)`; g.shadowBlur = 24; g.fillStyle = `rgba(${col},.16)`;
  g.beginPath(); g.moveTo(560, 806); g.lineTo(900, 806); g.lineTo(932, 832); g.lineTo(540, 832); g.closePath(); g.fill(); g.restore();
  g.strokeStyle = `rgba(${col},.7)`; g.lineWidth = 1.5; g.stroke();
  const lines = Math.min(5, Math.ceil(idx / 25));
  for (let i = 0; i < lines; i++) { const y = 812 + i * 4, w = i === lines - 1 ? 40 + (idx % 25) * 9 : 260; g.strokeStyle = `rgba(${col},.55)`; g.lineWidth = 1;
    g.beginPath(); g.moveTo(585 - i * 5, y); g.lineTo(585 - i * 5 + w, y); g.stroke(); }
  // bras avant, main et stylet (il écrit)
  const hx = 680 + 46 * Math.sin(now * 1.7) * act + 9 * Math.sin(now * 13) * act, hy = 790 + 4 * Math.sin(now * 17) * act;
  g.strokeStyle = metal(g, 440, 580, 520, 720); g.lineWidth = 46; g.beginPath(); g.moveTo(468, 590); g.lineTo(505, 712); g.stroke();
  g.strokeStyle = "#2a2d35"; g.lineWidth = 38; g.beginPath(); g.moveTo(505, 712); g.lineTo(hx - 22, hy - 10); g.stroke();
  for (const [x, y, r] of [[468, 588, 34], [505, 712, 24]]) { g.fillStyle = "#30333b"; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    g.strokeStyle = `rgba(${col},${.6 * glow})`; g.lineWidth = 2.5; g.beginPath(); g.arc(x, y, r * .62, 0, 7); g.stroke(); }
  g.strokeStyle = "#c9ced8"; g.lineWidth = 4; g.beginPath(); g.moveTo(hx - 6, hy - 40); g.lineTo(hx + 18, hy + 22); g.stroke();
  g.fillStyle = "#3a3d46"; g.beginPath(); g.arc(hx - 8, hy - 6, 22, 0, 7); g.fill();
  g.strokeStyle = "#555a65"; g.lineWidth = 7;
  for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(hx - 2 + i * 6, hy - 14 + i * 7); g.lineTo(hx + 14 + i * 3, hy + 2 + i * 6); g.stroke(); }
  if (act > .3) { g.fillStyle = `rgba(${col},${.5 + .5 * Math.sin(now * 20)})`; g.beginPath(); g.arc(hx + 18, hy + 22, 3, 0, 7); g.fill(); }
  g.restore();
}

// ------------------------------------------------------------ le câble tête -> écran, et les données qui y passent
function drawCable(g, now, col, live) {
  const a = [512, 420 + DY], b = [640, 820], c = [760, 320], d = [MON.x, 360];
  const P = (u) => { const v = 1 - u; return [0, 1].map(k => v * v * v * a[k] + 3 * v * v * u * b[k] + 3 * v * u * u * c[k] + u * u * u * d[k]); };
  g.lineCap = "round";
  for (const [w, s] of [[9, "#15171c"], [3, `rgba(${col},.35)`]]) { g.strokeStyle = s; g.lineWidth = w; g.beginPath();
    for (let i = 0; i <= 80; i++) { const [x, y] = P(i / 80); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
  if (live) for (let j = 0; j < 6; j++) { const [x, y] = P(((now * (.35 + energy)) + j / 6) % 1);
    g.fillStyle = `rgba(${col},.9)`; g.beginPath(); g.arc(x, y, 3.5, 0, 7); g.fill(); }
  g.fillStyle = "#30333b"; rr(g, MON.x - 12, 350, 16, 22, 3); g.fill();
}

// ------------------------------------------------------------ la seringue (scène) : arrive, se branche à la nuque, injecte tout, repart
function drawSyringe(g, now, t, out, col) {
  if (drug === "neutral" || t <= 0 || out >= 1) return;
  const appear = smooth(t / IV_IN), push = smooth((t - IV_IN) / IV_PUSH), away = smooth(out);
  const sx = 96 - 70 * away, y0 = 210, bw = 62, bh = 270, x0 = sx - bw / 2, tipY = y0 + bh + 46;
  g.save(); g.globalAlpha = Math.min(appear * 1.4, 1 - away);
  g.strokeStyle = "rgba(160,170,190,.35)"; g.lineWidth = 2; g.beginPath(); g.moveTo(sx, y0 - 80); g.lineTo(sx, y0 - 10); g.stroke();
  const liqTop = y0 + bh * push, lg = g.createLinearGradient(0, liqTop, 0, y0 + bh);
  lg.addColorStop(0, `rgba(${col},.95)`); lg.addColorStop(1, `rgba(${col},.5)`);
  g.fillStyle = lg; g.fillRect(x0 + 4, liqTop, bw - 8, Math.max(0, y0 + bh - liqTop));
  g.fillStyle = "rgba(220,225,235,.9)"; g.fillRect(x0 + 2, liqTop - 9, bw - 4, 9);
  g.fillStyle = "rgba(160,170,190,.8)"; g.fillRect(sx - 4, y0 - 40 + bh * push, 8, liqTop - (y0 - 40 + bh * push)); g.fillRect(sx - 28, y0 - 46 + bh * push, 56, 7);
  g.strokeStyle = "rgba(225,230,240,.85)"; g.lineWidth = 1.6; rr(g, x0, y0, bw, bh, 6); g.stroke();
  for (let i = 1; i < 10; i++) { const y = y0 + bh * i / 10; g.beginPath(); g.moveTo(x0, y); g.lineTo(x0 + (i % 5 ? 12 : 22), y); g.stroke(); }
  g.beginPath(); g.moveTo(sx, y0 + bh); g.lineTo(sx, tipY); g.stroke();
  const reach = smooth((t - IV_IN * .35) / (IV_IN * .65)), a = [sx, tipY], b = [sx, tipY + 160], c = [PORT.x - 170, PORT.y + 40], d = [PORT.x, PORT.y];
  const P = (u) => { const v = 1 - u; return [0, 1].map(k => v * v * v * a[k] + 3 * v * v * u * b[k] + 3 * v * u * u * c[k] + u * u * u * d[k]); };
  g.strokeStyle = "rgba(230,232,240,.55)"; g.lineWidth = 3; g.beginPath();
  for (let i = 0; i <= 100 * reach; i++) { const [x, y] = P(i / 100); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
  if (push > 0 && push < 1) for (let j = 0; j < 7; j++) { const [x, y] = P(((now * .55) + j / 7) % 1); g.fillStyle = `rgba(${col},.95)`; g.beginPath(); g.arc(x, y, 4.5, 0, 7); g.fill(); }
  if (push >= 1 && t < IV_IN + IV_PUSH + .5) { g.fillStyle = `rgba(${col},${Math.max(0, 1 - (t - IV_IN - IV_PUSH) * 2)})`; g.beginPath(); g.arc(PORT.x, PORT.y, 30, 0, 7); g.fill(); }
  g.restore();
}

// ------------------------------------------------------------ l'écran B1 et son instrumentation
function drawMonitor(g, now, col, live, hudOp) {
  g.save(); g.shadowColor = `rgba(${col},.22)`; g.shadowBlur = 70; g.fillStyle = "#0b0d11"; rr(g, MON.x, MON.y, MON.w, MON.h, 14); g.fill(); g.restore();
  g.strokeStyle = "rgba(190,200,220,.38)"; g.lineWidth = 2; rr(g, MON.x, MON.y, MON.w, MON.h, 14); g.stroke();
  g.fillStyle = "#04070a"; rr(g, MON.x + 14, MON.y + 14, MON.w - 28, MON.h - 28, 6); g.fill();
  g.fillStyle = "rgba(190,200,220,.3)"; g.beginPath(); g.arc(MON.x + MON.w / 2, MON.y + MON.h - 7, 2.5, 0, 7); g.fill();
  g.save(); g.globalAlpha *= hudOp;
  const si = live ? sliceIdx(clock) : -1, sl = si >= 0 ? E.slices[si] : null, L = MON.x + 30, R = VID.x + VID.w + 28, dim = "rgba(170,178,192,.6)";
  const label = (t, x, y) => { g.font = "400 13px 'Roboto Mono'"; g.fillStyle = dim; g.fillText(t, x, y); };
  const lead = (x0, y0, x1, y1) => { g.strokeStyle = `rgba(${col},.45)`; g.lineWidth = 1; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + (x1 - x0) * .4, y0); g.lineTo(x1, y1); g.stroke();
    g.fillStyle = `rgba(${col},.9)`; g.beginPath(); g.arc(x1, y1, 3, 0, 7); g.fill(); };
  // à gauche : phase et mots lus
  label("module cognitif", L, 150);
  g.font = "500 19px 'Roboto Mono'"; g.fillStyle = `rgb(${col})`; g.fillText(sl ? (sl.phase || "sobre").toLowerCase() : "en attente", L, 176);
  label("mots lus · j-lens", L, 218);
  const ws = sl ? sl.words : [], mx = Math.max(.01, ...ws.map(w => w[1]));
  ws.slice(0, 12).forEach(([w, p], j) => { const y = 245 + j * 29, f = p / mx;
    g.font = `${f > .7 ? 500 : 400} 14px 'Roboto Mono'`; g.fillStyle = `rgba(225,230,238,${.45 + .55 * f})`; g.fillText(w.slice(0, 16), L, y);
    g.fillStyle = `rgba(${col},.75)`; g.fillRect(L, y + 6, 160 * f, 3); });
  if (ws.length) { lead(L + 168, 251, VID.x - 8, VID.y + 70); lead(L + 168, 280, VID.x - 8, VID.y + 230); }
  // à droite : dose, flux, temps
  label("dose", R, 150);
  const a = live ? alphaAt(clock) : 0;
  g.font = "500 22px 'Roboto Mono'"; g.fillStyle = `rgb(${col})`; g.fillText((a >= 0 ? "+" : "−") + Math.abs(a).toFixed(2), R, 178);
  const bx = R, by = 194, bw = 168, bh = 70;
  g.strokeStyle = "rgba(170,178,192,.25)"; g.lineWidth = 1; g.strokeRect(bx, by, bw, bh); g.beginPath(); g.moveTo(bx, by + bh / 2); g.lineTo(bx + bw, by + bh / 2); g.stroke();
  if (E) { g.strokeStyle = `rgba(${col},.85)`; g.lineWidth = 1.5; g.beginPath();
    for (let i = 0; i <= 84; i++) { const t = E.duration * i / 84, y = by + bh / 2 - alphaAt(t) * bh * .45; i ? g.lineTo(bx + bw * i / 84, y) : g.moveTo(bx, y); } g.stroke();
    if (live) { const x = bx + bw * Math.min(1, clock / E.duration); g.strokeStyle = "rgba(240,242,246,.8)"; g.beginPath(); g.moveTo(x, by); g.lineTo(x, by + bh); g.stroke(); } }
  label("flux de pensée", R, 300);
  for (let i = 0; i < 22; i++) { let s = 0; for (let k = 0; k < 5; k++) s += fbins[2 + i * 5 + k]; const h = live ? 4 + 64 * Math.pow(s / 5 / 255, 1.3) : 4;
    g.fillStyle = `rgba(${col},${.35 + .6 * h / 68})`; g.fillRect(R + i * 7.6, 380 - h, 5, h); }
  label("image", R, 420); g.font = "400 16px 'Roboto Mono'"; g.fillStyle = "#d9dde4";
  g.fillText(sl ? `${si + 1}/${E.slices.length}` : "—", R, 443);
  label("temps", R, 482); g.fillStyle = "#d9dde4"; g.font = "400 16px 'Roboto Mono'"; g.fillText(E ? `${mmss(live ? clock : 0)} / ${mmss(E.duration)}` : "—", R, 505);
  lead(R - 8, 172, VID.x + VID.w + 8, VID.y + 90); lead(R - 8, 330, VID.x + VID.w + 8, VID.y + 300);
  g.restore();
}

// ------------------------------------------------------------ la vidéo dans l'écran : cadre droit, puis bordures vivantes
const ORG = {N: 240, reach: 0, lastWord: null};
function rayRect(th, hw, hh) { const c = Math.abs(Math.cos(th)), s = Math.abs(Math.sin(th)); return Math.min(c > 1e-6 ? hw / c : 1e9, s > 1e-6 ? hh / s : 1e9); }
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
function videoWindow(cam, m, now, dt) {
  const org = $("#organism"), c = [cam.X(VID.x + VID.w / 2), cam.Y(VID.y + VID.h / 2)], hw = VID.w / 2 * cam.s, hh = VID.h / 2 * cam.s;
  const k = Math.min(1.3, Math.abs(LA)), pos = LA >= 0, lsd = drug === "lsd", coke = drug === "cocaine", kk = drug === "neutral" ? 0 : Math.min(1, k);
  const lastW = $("#out").querySelector(".w:last-of-type"); if (lastW !== ORG.lastWord) { ORG.lastWord = lastW; ORG.reach = 1; } ORG.reach *= Math.exp(-dt / 2.2);
  const targets = []; if (lastW) { const r = lastW.getBoundingClientRect(); if (r.width) { const tx = r.left + r.width / 2 - c[0], ty = r.top + r.height / 2 - c[1];
    targets.push({a: Math.atan2(ty, tx), d: Math.hypot(tx, ty), w: .35 + .65 * ORG.reach}); } }
  const beat = Math.pow(Math.max(0, Math.sin(now * Math.PI * 2 * 1.15)), 6), pts = [];
  for (let i = 0; i < ORG.N; i++) {
    const th = i / ORG.N * Math.PI * 2, u = [Math.cos(th), Math.sin(th)], base = rayRect(th, hw, hh);
    let r = base;
    if (kk > 0 && pos) { let h = .035 * Math.sin(now * .5) + .25 * energy;
      if (lsd) { for (let n = 3; n <= 13; n += 2) h += (.13 / Math.sqrt(n)) * Math.sin(n * th + now * (.35 + .1 * n) + n * 1.3); h += .11 * Math.sin(6 * th - now * .6); }
      else if (coke) h += .016 * Math.sin(29 * th + now * 31) + .011 * Math.sin(53 * th - now * 47) + .05 * Math.pow(Math.abs(Math.sin(now * 6.5)), 8);   // cadre net qui vibre
      else h += .04 * Math.sin(2 * th + now * .35) + .14 * beat;
      let live = base * (1 + h);
      for (const t of targets) { const sig = lsd ? .05 : coke ? .1 : .3; live += Math.max(0, t.d - base) * (lsd ? .45 : coke ? .3 : .25) * t.w * Math.exp(-(angDiff(th, t.a) ** 2) / (2 * sig * sig)); }
      r = lerp(base, live, kk * Math.max(.3, m)); }
    else if (kk > 0) { const sides = 7, seg = Math.PI * 2 / sides, a0 = ((th % seg) + seg) % seg - seg / 2; r = lerp(base, Math.min(hw, hh) * 1.15 * Math.cos(seg / 2) / Math.cos(a0), kk); }
    pts.push([c[0] + u[0] * r, c[1] + u[1] * r]);
  }
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  Object.assign(org.style, {left: x0 + "px", top: y0 + "px", width: x1 - x0 + "px", height: y1 - y0 + "px"});
  org.style.clipPath = `path("M${pts.map(([x, y]) => (x - x0).toFixed(1) + " " + (y - y0).toFixed(1)).join(" L")} Z")`;
  org.style.filter = !pos && kk > 0 ? `grayscale(${kk * .8}) brightness(${1 - .25 * kk})` : lsd && kk > 0 ? `hue-rotate(${(Math.sin(now * .25) * 70 * kk).toFixed(1)}deg) saturate(${1 + .6 * kk})`
    : coke && kk > 0 ? `contrast(${1 + .35 * kk}) saturate(${1 + .5 * kk}) brightness(${1 + .08 * kk})`
    : kk > 0 ? `sepia(${.25 * kk}) saturate(${1 + .3 * kk}) hue-rotate(${-15 * kk}deg)` : "";
  return {pts, c, kk, pos, lsd, coke, beat};
}
function drawMembrane(g, win, now, col) {
  const {pts, c, kk, pos, lsd, coke, beat} = win;
  const ring = (sc) => { g.beginPath(); pts.forEach(([x, y], i) => { const X = c[0] + (x - c[0]) * sc, Y = c[1] + (y - c[1]) * sc; i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); g.closePath(); };
  if (kk < .02) { g.strokeStyle = `rgba(${col},.4)`; g.lineWidth = 1; ring(1); g.stroke(); return; }
  if (pos && lsd) { const h0 = (now * 40) % 360;
    for (const [sc, al] of [[1.10, .18], [1.05, .35], [1, .9]]) { g.strokeStyle = `hsla(${(h0 + sc * 300) % 360} 95% 65% / ${al * kk})`; g.lineWidth = sc === 1 ? 2.5 : 1.5;
      g.shadowColor = `hsla(${h0} 100% 70% / ${kk})`; g.shadowBlur = sc === 1 ? 22 : 8; ring(sc); g.stroke(); } }
  else if (pos && coke) { const fl = .7 + .3 * Math.random();   // givre électrique, qui scintille
    g.strokeStyle = `rgba(120,220,255,${.45 * kk * fl})`; g.lineWidth = 1; g.shadowColor = "rgba(200,240,255,.9)"; g.shadowBlur = 10; ring(1.025); g.stroke();
    g.strokeStyle = `rgba(245,250,255,${.95 * kk * fl})`; g.lineWidth = 1.8; g.shadowBlur = 18; ring(1); g.stroke(); }
  else if (pos) { g.strokeStyle = `rgba(255,150,190,${(.6 + .4 * beat) * kk})`; g.lineWidth = 3 + 8 * beat; g.shadowColor = "rgba(255,90,160,.95)"; g.shadowBlur = 30 + 40 * beat; ring(1); g.stroke(); }
  else { g.strokeStyle = `rgba(170,180,190,${.6 * kk})`; g.lineWidth = 1; ring(1); g.stroke(); }
  g.shadowBlur = 0;
}

// ------------------------------------------------------------ terminal B2 : ce que le robot écrit
function addWord(i, st) {
  const w = E.words[i], out = $("#out"), cur = out.querySelector(".cur");
  for (let n = 0; n < w.nl; n++) out.insertBefore(document.createElement("br"), cur);
  const el = document.createElement("span"); el.className = "w"; [...w.w].forEach(ch => { const c = document.createElement("span"); c.textContent = ch; el.appendChild(c); });
  out.insertBefore(el, cur); TYPO.birth(el, i, st, clock); born = anim;
  const wrap = $("#wrap"); wrap.scrollTop = wrap.scrollHeight;
}
function styleOutput() { const basePx = parseFloat(getComputedStyle($("#out")).fontSize), box = $("#wrap");
  for (const el of $("#out").children) { if (!el.classList.contains("w") || el._done) continue; TYPO.style(el, clock, {ent: .5, box, basePx}); if (TYPO.still(el, clock)) el._done = true; } }
function placeOutput(cam, m, W, H) {
  const A = [cam.X(LOG.x), cam.Y(LOG.y), cam.X(LOG.x + LOG.w), cam.Y(LOG.y + LOG.h)];
  const B = [W * .03 + VID.w * cam.s1 + W * .025, H * .06, W * .975, H * .94], o = $("#output").style;
  o.left = lerp(A[0], B[0], m) + "px"; o.top = lerp(A[1], B[1], m) + "px"; o.width = lerp(A[2], B[2], m) - lerp(A[0], B[0], m) + "px"; o.height = lerp(A[3], B[3], m) - lerp(A[1], B[1], m) + "px";
}

// ------------------------------------------------------------ boucle
function frame(nowMs) {
  const dt = Math.min(.1, (nowMs - last) / 1000); last = nowMs;
  if (!paused) step(dt);
  requestAnimationFrame(frame);
}
function step(dt) {
  anim += dt; const now = anim;
  if (phase === "prompt" || phase === "iv") {
    pre += dt;
    const q = E.prompt, nq = Math.floor(Math.max(0, pre - .9) / 4.2 * q.length);
    $("#prompt .q").innerHTML = q.slice(0, nq) + '<span class="caret"></span>';
    if (phase === "prompt" && pre >= PRE_PROMPT) { if (drug === "neutral") startLive(); else phase = "iv"; }
    else if (phase === "iv" && pre >= PRE_PROMPT + ivTotal()) startLive();
  }
  if (phase === "live") { const s = sounding(), v = $("#organism video"); clock = s.currentTime; if (s !== v && Math.abs(v.currentTime - clock) > .15) v.currentTime = clock;
    if (s.ended) phase = "end"; }
  const live = phase === "live" || phase === "end", a = live ? alphaAt(clock) : 0;
  LA += (a - LA) * (1 - Math.exp(-dt / 1.2));
  TYPO.update(a, dt); const st = TYPO.state();
  if (phase === "live") while (idx < E.words.length && E.words[idx].t <= clock) addWord(idx++, st);
  if (analyser && !paused) analyser.getByteFrequencyData(fbins);
  { let s = 0; for (let i = 2; i < 120; i++) s += fbins[i]; energy += (((live ? s : 0) / 118 / 255) - energy) * (1 - Math.exp(-dt / .1)); }
  const m = live ? smooth((clock - ZOOM_AT) / ZOOM_DUR) : 0;
  const [g, W, H] = fit($("#stage")), cam = camera(m, W, H), col = DRUGCOL[drug].join(",");
  document.documentElement.style.setProperty("--acc", `rgb(${col})`);
  const bg = g.createRadialGradient(W * .45, H * .42, 0, W * .45, H * .42, W * .75); bg.addColorStop(0, "#17191f"); bg.addColorStop(1, "#040406");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const op = phase === "idle" ? 0 : live ? 1 : smooth(pre / 1.2), act = phase === "live" ? .35 + .65 * Math.exp(-(anim - born) * 3) : 0;
  cam.apply(g); g.globalAlpha = op;
  drawMonitor(g, now, col, live, 1 - smooth((m - .45) / .4)); drawCable(g, now, col, live); drawRoom(g, now, col, act);
  drawSyringe(g, now, phase === "iv" ? pre - PRE_PROMPT : live ? ivTotal() + clock : 0, live ? clock / 1.5 : 0, col);
  g.globalAlpha = 1; g.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const vg = g.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, W * .75); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.55)");
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  const [fg] = fit($("#fx")); fg.clearRect(0, 0, W, H);
  $("#organism").style.display = E && phase !== "idle" ? "block" : "none";
  placeOutput(cam, m, W, H);
  if (E && phase !== "idle") {
    const win = videoWindow(cam, m, now, dt);
    $("#organism").style.opacity = live ? 1 : .28 * op;
    drawMembrane(fg, win, now, col);
  }
  $("#prompt").style.opacity = live ? Math.max(0, 1 - clock / 1.6) : op;
  $("#output").style.opacity = op;
  $("#output").style.background = drug === "neutral" || !live ? `rgba(8,10,13,${lerp(.88, .97, m)})` : `hsla(${st.bg_hue} ${st.bg_sat}% ${Math.min(st.bg_light, 11)}% / ${lerp(.9, .97, m)})`;
  $("#output").style.borderColor = `rgba(${col},${live ? .45 : .3})`;
  styleOutput();
}

// ------------------------------------------------------------ lecture, pause, remise à zéro
function audioGraph(el) {
  if (!actx) actx = new AudioContext();
  if (!sources.has(el)) { const src = actx.createMediaElementSource(el), an = actx.createAnalyser(); an.fftSize = 1024; src.connect(an); an.connect(actx.destination); sources.set(el, an); }
  analyser = sources.get(el); actx.resume();
}
function startLive() {
  phase = "live"; clock = 0; const v = $("#organism video"), s = sounding();
  audioGraph(s); v.muted = s !== v; v.currentTime = 0; if (s !== v) s.currentTime = 0; v.play(); if (s !== v) s.play();
}
function setPaused(p) {
  paused = p; $("#paused").style.display = p ? "block" : "none";
  const v = $("#organism video"), s = sounding();
  if (phase === "live") { if (p) { v.pause(); s.pause(); } else { v.play(); s.play(); } }
}
async function start(d) {
  if (!EXPS[d]) return;
  drug = d; paused = false; $("#paused").style.display = "none";
  E = await (await fetch(`data/exp_${EXPS[d]}.json`)).json();
  const v = $("#organism video"), au = $("#audio"); v.pause(); au.pause();
  const [vu, aud] = await Promise.all([blobURL(E.video), E.audio ? blobURL(E.audio) : null]);
  if (v.dataset.src !== vu) { v.src = vu; v.dataset.src = vu; }
  if (aud && au.dataset.src !== aud) { au.src = aud; au.dataset.src = aud; }
  v.currentTime = 0; v.muted = true;
  phase = "prompt"; pre = 0; clock = 0; idx = 0; LA = 0; fbins.fill(0);
  TYPO.setDrug(d); TYPO.reset(); $("#out").innerHTML = '<span class="cur"></span>';
  $("#output .hd").innerHTML = `[ Journal de bord · <b>${E.id}</b> ]`;
  document.querySelectorAll("#drugs button").forEach(b => b.classList.toggle("on", b.dataset.drug === d));
}

(async () => {
  EXPS = await (await fetch("data/experiences.json")).json();
  document.querySelectorAll("#drugs button").forEach(b => { b.disabled = !EXPS[b.dataset.drug];
    b.onclick = () => { if (!actx) actx = new AudioContext(); start(b.dataset.drug); }; });
  addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); if (phase !== "idle") setPaused(!paused); }
    else if (e.key === "Enter") { e.preventDefault(); if (EXPS[drug] && phase !== "idle") start(drug); }
  });
  requestAnimationFrame((n) => { last = n; requestAnimationFrame(frame); });
})();
</script>
