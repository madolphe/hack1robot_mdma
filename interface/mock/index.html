<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>hack1robo · maquettes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&family=Roboto+Flex:opsz,slnt,wdth,wght,GRAD,XOPQ,XTRA,YOPQ,YTAS,YTDE,YTFI,YTLC,YTUC@8..144,-10..0,25..151,100..1000,-200..150,27..175,323..603,25..135,649..854,-305..-98,560..788,416..570,528..760&display=block" rel="stylesheet">
<style>
  /* Maquette figée : LSD au pic, ~30 % du texte écrit. ?theme=a (protocole clinique), b (imagerie cérébrale), c (chambre noire). */
  * { box-sizing:border-box; margin:0; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body { display:grid; grid-template-rows: 70px 194px minmax(0, 1fr); gap:22px; padding:34px 44px;
         background:var(--bg); color:var(--ink); font-family:"Roboto Flex", sans-serif;
         font-variation-settings:'wdth' 92, 'wght' 380, 'opsz' 14; }
  .zone { position:relative; min-height:0; min-width:0; overflow:hidden; }

  #drugs { display:flex; justify-content:center; align-items:center; gap:34px; }
  #drugs button { font:inherit; font-size:17px; letter-spacing:.04em; font-variation-settings:'wdth' 100, 'wght' 520; cursor:pointer; }
  #state { display:grid; grid-template-columns: 1.55fr 1fr; gap:22px; min-height:0; }
  #dose canvas, #net canvas, #spectrum canvas { width:100%; height:100%; display:block; }
  #about { display:flex; flex-direction:column; justify-content:center; padding:0 26px; }
  #about .phase { font-size:30px; font-variation-settings:'wdth' 100, 'wght' 560, 'opsz' 40; }
  #about .desc { font-size:16px; line-height:1.5; margin-top:12px; max-width:44ch; color:var(--ink2); }
  #main { display:grid; grid-template-columns: 19% minmax(0, 1fr) 30%; gap:22px; min-height:0; }
  #prompt { display:flex; flex-direction:column; justify-content:center; padding:0 18px; }
  #prompt .q { font-size:30px; line-height:1.22; font-variation-settings:'wdth' 96, 'wght' 420, 'opsz' 40; }
  #prompt .ctx { font-size:15px; line-height:1.5; margin-top:22px; color:var(--ink2); font-variation-settings:'wdth' 96, 'wght' 330, 'slnt' -6; }
  #center { display:grid; grid-template-rows: 30fr 56fr 14fr; gap:22px; min-height:0; }
  #latent img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #keywords { display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:6px 18px; padding:0 20px; }
  #keywords span { font-size:15px; font-variation-settings:'wdth' 96, 'wght' 380; }
  #right { display:grid; grid-template-rows: 64fr 36fr; gap:22px; min-height:0; }
  #output { padding:26px 26px 40px; overflow:hidden; }
  #out { font-family:"Recursive"; font-size:22px; line-height:1.5; }
  #out .w { display:inline-block; margin-right:.3em; white-space:nowrap; }
  #out .w span { display:inline-block; }

  /* ---------- A : protocole clinique (feuille claire, la drogue tache) */
  body.a { --bg:#EEF0F1; --ink:#1D2328; --ink2:#5B656D; --rule:#AEB6BC; }
  .a #drugs button { border:1.5px solid var(--ink); border-radius:999px; padding:12px 0; width:150px; color:var(--ink); position:relative; overflow:hidden; background:transparent; }
  .a #drugs button i { position:absolute; inset:0 50% 0 0; z-index:-1; }
  .a #drugs button[data-d=lsd] i { background:#6B3CFF; } .a #drugs button[data-d=mdma] i { background:#FF6A3D; }
  .a #drugs button[data-d=neutral] i { background:#fff; }
  .a #drugs button.on { color:#fff; } .a #drugs button.on i { inset:0; }
  .a #dose, .a #about, .a #prompt, .a #net, .a #keywords, .a #output, .a #spectrum { border-top:1px solid var(--rule); }
  .a #latent { outline:1px solid var(--rule); outline-offset:-1px; }
  .a #latent img { mix-blend-mode:multiply; filter:saturate(1.1); }

  /* ---------- B : imagerie cérébrale (noir, fausses couleurs d'activité) */
  body.b { --bg:#000; --ink:#C9CDD2; --ink2:#7A8088; }
  .b #drugs button { background:transparent; color:var(--ink2); border:0; padding:10px 6px; border-bottom:2px solid transparent; }
  .b #drugs button.on { color:#fff; border-image:linear-gradient(90deg,#2E7BFF,#FF3B2F,#FFE45C) 1; border-bottom:2px solid; }
  .b #latent img { filter:contrast(1.05); }

  /* ---------- C : chambre noire (tout est lumière projetée) */
  body.c { --bg:#000; --ink:#BFC3C9; --ink2:#6E7379; }
  .c #drugs button { background:transparent; border:0; color:#5d6167; padding:10px 14px; }
  .c #drugs button.on { color:#fff; text-shadow:0 0 14px rgba(160,120,255,.9), 0 0 40px rgba(160,120,255,.6); }
  .c #prompt .q, .c #about .phase { text-shadow:0 0 18px rgba(255,255,255,.25); }
  .c #latent { -webkit-mask: radial-gradient(ellipse 70% 72% at 50% 50%, #000 55%, transparent 100%); mask: radial-gradient(ellipse 70% 72% at 50% 50%, #000 55%, transparent 100%); }
  .c #latent img { filter:blur(.6px) saturate(1.2) brightness(1.05); }
  .c #keywords span { text-shadow:0 0 10px rgba(170,130,255,.7); }
</style>
</head>
<body>
<section id="drugs" class="zone">
  <button data-d="lsd" class="on"><i></i>LSD</button>
  <button data-d="mdma"><i></i>MDMA</button>
  <button data-d="neutral"><i></i>NEUTRAL</button>
</section>
<section id="state">
  <div id="dose" class="zone"><canvas></canvas></div>
  <div id="about" class="zone"><div class="phase"></div><div class="desc"></div></div>
</section>
<section id="main">
  <div id="prompt" class="zone"><div class="q"></div><div class="ctx"></div></div>
  <div id="center">
    <div id="net" class="zone"><canvas></canvas></div>
    <div id="latent" class="zone"><img alt=""></div>
    <div id="keywords" class="zone"></div>
  </div>
  <div id="right">
    <div id="output" class="zone"><div id="out"></div></div>
    <div id="spectrum" class="zone"><canvas></canvas></div>
  </div>
</section>

<script src="data.js"></script>
<script src="../typo.js"></script>
<script>
const theme = new URLSearchParams(location.search).get("theme") || "b";
document.body.classList.add(theme);
const $ = (s) => document.querySelector(s), D = MOCK, P_NOW = 0.31;

$("#prompt .q").textContent = D.question; $("#prompt .ctx").textContent = D.context;
$("#about .phase").textContent = D.phase; $("#about .desc").textContent = D.about;
$("#latent img").src = D.frame;

// ---------- courbe α (même courbe que l'interface)
const C = {t1: .25, t2: .40, t3: .72, peak: 1, neg: -.6, end: -.1};
function alphaAt(p) {
  const e = (a, b, x) => a + (b - a) * (.5 - .5 * Math.cos(Math.PI * Math.max(0, Math.min(1, x))));
  if (p <= C.t1) return e(0, C.peak, p / C.t1); if (p <= C.t2) return C.peak;
  if (p <= C.t3) return e(C.peak, C.neg, (p - C.t2) / (C.t3 - C.t2)); return e(C.neg, C.end, (p - C.t3) / (1 - C.t3));
}
function cv(sel) { const c = $(sel + " canvas"), r = c.getBoundingClientRect(); c.width = r.width * 2; c.height = r.height * 2;
  const g = c.getContext("2d"); g.scale(2, 2); return [g, r.width, r.height]; }
// rampe de fausses couleurs (B), déplacée vers violet/cyan pour le LSD
const RAMP = ["#1B2A6B", "#3B3BFF", "#9B3CFF", "#FF3BA0", "#FFE45C"];
function ramp(v) { v = Math.max(0, Math.min(.999, v)) * (RAMP.length - 1); const i = Math.floor(v), f = v - i;
  const h = (s) => [1, 3, 5].map(k => parseInt(s.slice(k, k + 2), 16)), a = h(RAMP[i]), b = h(RAMP[i + 1]);
  return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f)).join(",")})`; }
const rnd = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };

// ---------- dose
(() => {
  const [g, W, H] = cv("#dose"), pad = 16, y = (v) => H / 2 - v / 1.2 * (H / 2 - pad), X = (q) => pad + q * (W - 2 * pad);
  const path = (to) => { g.beginPath(); for (let i = 0; i <= 300 * to; i++) { const q = i / 300; i ? g.lineTo(X(q), y(alphaAt(q))) : g.moveTo(X(q), y(alphaAt(q))); } };
  if (theme === "a") {
    g.strokeStyle = "#AEB6BC"; g.lineWidth = 1; g.setLineDash([2, 4]); g.beginPath(); g.moveTo(pad, y(0)); g.lineTo(W - pad, y(0)); g.stroke(); g.setLineDash([]);
    path(1); g.strokeStyle = "#AEB6BC"; g.lineWidth = 1.2; g.stroke();
    path(P_NOW); g.lineTo(X(P_NOW), y(0)); g.lineTo(pad, y(0)); g.closePath(); g.fillStyle = "rgba(107,60,255,.16)"; g.fill();
    path(P_NOW); g.strokeStyle = "#6B3CFF"; g.lineWidth = 2.4; g.stroke();
    g.fillStyle = "#1D2328"; g.fillRect(X(P_NOW) - .5, 6, 1, H - 12);
  } else if (theme === "b") {
    for (let i = 0; i < 300; i++) { const q = i / 300, a = alphaAt(q), x = X(q);
      g.fillStyle = q <= P_NOW ? ramp(.35 + a * .65) : "#15171c"; g.globalAlpha = q <= P_NOW ? .9 : 1;
      const yy = y(a); g.fillRect(x, Math.min(yy, y(0)), (W - 2 * pad) / 300 + .6, Math.abs(yy - y(0)) + 1); }
    g.globalAlpha = 1; path(1); g.strokeStyle = "#3a3f47"; g.lineWidth = 1; g.stroke();
  } else {
    path(1); g.strokeStyle = "rgba(255,255,255,.08)"; g.lineWidth = 1; g.stroke();
    g.shadowColor = "rgba(170,120,255,.9)"; g.shadowBlur = 18; path(P_NOW); g.strokeStyle = "#e6dcff"; g.lineWidth = 2; g.stroke();
    g.beginPath(); g.arc(X(P_NOW), y(alphaAt(P_NOW)), 4, 0, 7); g.fillStyle = "#fff"; g.fill(); g.shadowBlur = 0;
  }
})();

// ---------- réseau : 48 couches, bande lue 19-44, couches droguées 22-33
(() => {
  const [g, W, H] = cv("#net"), L = 48, NODES = 7, pad = 30, top = 22, bot = H - 22;
  const lx = (l) => pad + l / (L - 1) * (W - 2 * pad), ny = (k) => top + k / (NODES - 1) * (bot - top);
  for (let l = 0; l < L; l++) {
    const band = l >= 19 && l <= 44, drug = l >= 22 && l <= 33;
    if (l < L - 1) {
      g.lineWidth = theme === "a" ? .5 : .6;
      g.strokeStyle = theme === "a" ? "rgba(29,35,40,.18)" : theme === "b" ? "rgba(255,255,255,.05)" : "rgba(200,180,255,.05)";
      g.beginPath(); for (let i = 0; i < NODES; i++) for (let j = 0; j < NODES; j += 2) { g.moveTo(lx(l), ny(i)); g.lineTo(lx(l + 1), ny((i + j) % NODES)); } g.stroke();
    }
    for (let i = 0; i < NODES; i++) {
      const act = (band ? .25 : .05) + (drug ? .55 : 0) + .25 * rnd(l, i);
      if (theme === "a") {
        g.beginPath(); g.arc(lx(l), ny(i), drug ? 4 : 2.4, 0, 7);
        if (drug) { g.fillStyle = `rgba(107,60,255,${.35 + .6 * act})`; g.fill(); } else { g.strokeStyle = "#1D2328"; g.lineWidth = .8; g.stroke(); }
      } else if (theme === "b") {
        g.fillStyle = ramp(act); g.beginPath(); g.arc(lx(l), ny(i), 2 + act * 3.2, 0, 7); g.fill();
      } else {
        g.shadowColor = drug ? "rgba(170,120,255,1)" : "rgba(255,255,255,.6)"; g.shadowBlur = drug ? 14 : 4;
        g.fillStyle = drug ? `rgba(230,215,255,${.5 + .5 * act})` : `rgba(255,255,255,${band ? .35 : .12})`;
        g.beginPath(); g.arc(lx(l), ny(i), drug ? 2.4 : 1.4, 0, 7); g.fill(); g.shadowBlur = 0;
      }
    }
  }
})();

// ---------- mots-clés
D.keywords.forEach((w, i) => { const s = document.createElement("span"); s.textContent = w;
  const on = rnd(i, 3) > .25; s.style.opacity = on ? 1 : .22;
  if (theme === "b" && on) s.style.color = ramp(.45 + .5 * rnd(i, 9));
  if (theme === "a" && on) s.style.color = rnd(i, 9) > .5 ? "#6B3CFF" : "#1D2328";
  if (theme === "c") s.style.color = on ? "#e8deff" : "#4d4f55";
  $("#keywords").appendChild(s); });

// ---------- texte de sortie : moteur de typolab, mots figés à leur naissance le long de la courbe
(() => {
  TYPO.setDrug("lsd"); TYPO.reset();
  const N = D.words.length, out = $("#out"), basePx = 22, box = $("#output");
  let t = 0; const els = [];
  D.words.forEach((w, i) => {
    const p = (i + 1) / N * P_NOW, a = alphaAt(p);
    for (let k = 0; k < 6; k++) TYPO.update(a, .055);
    t += .33; const st = TYPO.state();
    for (let n = 0; n < w.nl; n++) out.appendChild(document.createElement("br"));
    const el = document.createElement("span"); el.className = "w";
    [...w.w].forEach(ch => { const c = document.createElement("span"); c.textContent = ch; el.appendChild(c); });
    out.appendChild(el); TYPO.birth(el, i, st, t); el._ent = w.ent; els.push(el);
  });
  const st = TYPO.state();
  els.forEach(el => TYPO.style(el, t, {ent: el._ent, box, basePx}));
  box.scrollTop = box.scrollHeight;
  if (theme === "a") {  // sur la feuille claire : couleurs du moteur assombries, fond teinté pâle
    // le navigateur renvoie les couleurs en rgb() : on passe en TSL et on inverse la luminosité (encre sur papier)
    const toHsl = (r, g, b) => { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
      if (mx === mn) return [0, 0, l * 100]; const d = mx - mn, sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
      const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return [h * 60, sat * 100, l * 100]; };
    out.querySelectorAll(".w span").forEach(s => { const m = s.style.color.match(/rgb\((\d+), (\d+), (\d+)\)/); if (!m) return;
      const [h, sa, l] = toHsl(+m[1], +m[2], +m[3]); s.style.color = `hsl(${h.toFixed(0)} ${Math.min(100, sa + 15).toFixed(0)}% ${Math.max(22, 100 - l * 0.85).toFixed(0)}%)`; });
    out.querySelectorAll(".w").forEach(w => { w.style.textShadow = w.style.textShadow.replace(/hsl\(([\d.]+) ([\d.]+)% ([\d.]+)%/g, (m, h, sa) => `hsl(${h} ${sa}% 45%`); });
    box.style.background = `hsl(${st.bg_hue} 60% 93%)`;
  } else if (theme === "b") {
    box.style.background = "#000";
  } else {
    box.style.background = `radial-gradient(ellipse at 50% 45%, hsl(${st.bg_hue} 45% 9%), #000 75%)`;
    out.querySelectorAll(".w").forEach(w => { w.style.textShadow = (w.style.textShadow === "none" ? "" : w.style.textShadow + ", ") + "0 0 12px rgba(190,150,255,.55)"; });
  }
})();

// ---------- spectre (valeurs simulées d'une voix : énergie surtout dans les graves et médiums)
(() => {
  const [g, W, H] = cv("#spectrum"), B = 72, mid = H / 2;
  const v = Array.from({length: B}, (_, b) => { const f = b / B; return Math.max(0, (Math.exp(-((f - .22) ** 2) / .02) * .85 + Math.exp(-((f - .48) ** 2) / .01) * .35) * (.7 + .3 * rnd(b, 2))); });
  if (theme === "a") {
    g.strokeStyle = "#1D2328"; g.lineWidth = 1;
    for (let b = 0; b < B; b++) { const x = b / (B - 1) * W, h = v[b] * H * .42; g.beginPath(); g.moveTo(x, mid - h); g.lineTo(x, mid + h); g.stroke(); }
    g.strokeStyle = "#AEB6BC"; g.beginPath(); g.moveTo(0, mid); g.lineTo(W, mid); g.stroke();
  } else if (theme === "b") {
    const rows = 22;
    for (let b = 0; b < B; b++) for (let r = 0; r < rows; r++) {
      const val = v[b] * (1 - r / rows * .9) * (.8 + .4 * rnd(b, r)); if (val < .05) continue;
      g.fillStyle = ramp(val); g.fillRect(b / B * W, H - (r + 1) * H / rows, W / B - 1, H / rows - 1);
    }
  } else {
    g.shadowColor = "rgba(170,120,255,.9)"; g.shadowBlur = 16; g.strokeStyle = "#efe8ff"; g.lineWidth = 1.6;
    for (const sgn of [-1, 1]) { g.beginPath(); for (let b = 0; b < B; b++) { const x = b / (B - 1) * W, yy = mid + sgn * v[b] * H * .42; b ? g.lineTo(x, yy) : g.moveTo(x, yy); } g.stroke(); }
  }
})();
</script>
</body>
</html>
