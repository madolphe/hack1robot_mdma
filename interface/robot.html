<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>hack1robo · le robot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&family=Roboto+Flex:opsz,slnt,wdth,wght,GRAD,XOPQ,XTRA,YOPQ,YTAS,YTDE,YTFI,YTLC,YTUC@8..144,-10..0,25..151,100..1000,-200..150,27..175,323..603,25..135,649..854,-305..-98,560..788,416..570,528..760&display=swap" rel="stylesheet">
<style>

  #stage { position:fixed; inset:0; width:100vw; height:100vh; z-index:0; }
  #organism { position:fixed; z-index:2; pointer-events:none; display:none; }
  #organism video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #jspace { position:absolute; inset:0; pointer-events:none; }
  #jspace span { position:absolute; white-space:nowrap; line-height:1; transition:opacity .4s; font-family:"Roboto Flex"; text-shadow:0 1px 12px rgba(0,0,0,.8); }
  #fx { position:fixed; inset:0; width:100vw; height:100vh; z-index:3; pointer-events:none; }
  #prompt { position:fixed; left:18vw; right:18vw; top:2.6vh; z-index:4; text-align:center; pointer-events:none; transition:opacity .4s;
            font-variation-settings:'wdth' 96, 'wght' 360, 'opsz' 48; font-size:2.5vh; line-height:1.35; }
  #prompt .ctx { font-size:1.9vh; color:#9a99a3; margin-top:.8vh; font-variation-settings:'wdth' 96, 'wght' 330, 'slnt' -7; }
  #prompt .caret { display:inline-block; width:.08em; height:1em; background:#e9e7e2; vertical-align:-.12em; margin-left:.06em; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #output { position:fixed; left:76vw; right:2.4vw; top:15vh; bottom:8vh; z-index:4; overflow:hidden; padding:2vh 1.2vw;
            border-radius:10px; transition:background .4s, opacity .8s; opacity:0; }
  #out { font-family:"Recursive"; font-size:2.1vh; line-height:1.5; }
  #out .w { display:inline-block; margin-right:.3em; white-space:nowrap; }
  #out .w span { display:inline-block; }
  #drugs { position:fixed; left:2vw; top:2.6vh; z-index:6; display:flex; gap:.8vw; }
  #drugs button { font:inherit; font-size:1.5vh; letter-spacing:.14em; font-variation-settings:'wdth' 100, 'wght' 600; color:#c9c7c2;
                  background:rgba(255,255,255,.04); border:1px solid #2c2c36; border-radius:999px; padding:.8vh 1.4vw; cursor:pointer; }
  #drugs button.on { background:#e9e7e2; color:#06070a; border-color:#e9e7e2; }
  #drugs button:disabled { opacity:.25; cursor:default; }
  #paused { position:fixed; right:2vw; top:2.6vh; z-index:6; font-size:1.5vh; letter-spacing:.14em; color:#9a99a3; display:none; font-variation-settings:'wght' 600; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="organism"><video playsinline preload="auto"></video><div id="jspace"></div></div>
<canvas id="fx"></canvas>
<div id="prompt"><div class="q"></div><div class="ctx"></div></div>
<div id="output"><div id="out"></div></div>
<div id="drugs"><button data-drug="lsd">LSD</button><button data-drug="mdma">MDMA</button><button data-drug="neutral">NEUTRAL</button></div>
<div id="paused">PAUSE</div>
<audio id="audio" preload="auto"></audio>

<script src="typo.js"></script>
<script>
/* Le robot. Séquence : 1. le robot apparaît, la consigne se tape au-dessus de sa tête ;  2. (drogue) une seringue
   arrive, son tube rejoint le port du cou, elle injecte toute la dose ;  3. l'expérience commence : la consigne et la
   seringue s'en vont, la vidéo et son son démarrent dans le crâne de verre, le robot écrit ;  4. à ZOOM_AT s, on
   entre doucement (ZOOM_DUR s) dans la tête : la vidéo passe au premier plan ;  5. sous drogue, bordures vivantes.
   Données : data/experiences.json -> data/exp_<id>.json (interface/prepare_md.py, depuis la fiche .md d'un run).
   Clavier : espace = pause ; entrée = on recommence depuis le début. */
const $ = (s) => document.querySelector(s);
const PRE_PROMPT = 6.5, IV_IN = 1.0, IV_PUSH = 3.4, IV_HOLD = .6, ZOOM_AT = 5, ZOOM_DUR = 7;
const DRUGCOL = {lsd: [124, 58, 255], mdma: [255, 92, 150], neutral: [200, 210, 220]};
let EXPS = {}, E = null, drug = "neutral", phase = "idle", pre = 0, clock = 0, last = 0, idx = 0, LA = 0, paused = false;
let actx = null, analyser = null, fbins = null, energy = 0;
const sources = new Map(), blobs = {};
const blobURL = async (p) => blobs[p] ||= URL.createObjectURL(await (await fetch(p)).blob());
const smooth = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
function fit(cv) { const r = cv.getBoundingClientRect(), d = devicePixelRatio;
  if (cv.width !== Math.round(r.width * d) || cv.height !== Math.round(r.height * d)) { cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); }
  const g = cv.getContext("2d"); g.setTransform(d, 0, 0, d, 0, 0); return [g, r.width, r.height]; }
const ivTotal = () => drug === "neutral" ? 0 : IV_IN + IV_PUSH + IV_HOLD;
const sounding = () => E && E.audio ? $("#audio") : $("#organism video");   // l'élément qui porte le son (et l'heure)

// ------------------------------------------------------------ la dose, image par image (fiche du run)
function sliceAt(t) { const S = E.slices; let i = S.findIndex(s => t < s.t1); return S[i < 0 ? S.length - 1 : i]; }
function alphaAt(t) {  // interpolée entre les centres des images
  if (!E || drug === "neutral") return 0;
  const S = E.slices, c = S.map(s => (s.t0 + s.t1) / 2);
  if (t <= c[0]) return S[0].alpha * smooth(t / c[0]);
  for (let i = 1; i < S.length; i++) if (t <= c[i]) return lerp(S[i - 1].alpha, S[i].alpha, smooth((t - c[i - 1]) / (c[i] - c[i - 1])));
  return S[S.length - 1].alpha;
}

// ------------------------------------------------------------ caméra (scène 1920 x 1080 -> écran)
const DOME = {x: 960, y: 345, rx: 255, ry: 215}, PORT = {x: 905, y: 760};
function camera(m, W, H) {
  const base = Math.min(W / 1920, H / 1080), target = (W * 0.31) / (DOME.rx * base), s = base * lerp(1, target, m);
  const tx = lerp(W / 2, W * 0.43, m), ty = lerp(H * 0.5 + (DOME.y - 540) * base + 40 * base, H * 0.53, m);
  return {s, base, X: (x) => tx + (x - DOME.x) * s, Y: (y) => ty + (y - DOME.y) * s,
          apply: (g) => g.setTransform(devicePixelRatio * s, 0, 0, devicePixelRatio * s, devicePixelRatio * (tx - DOME.x * s), devicePixelRatio * (ty - DOME.y * s))};
}

// ------------------------------------------------------------ le robot (métal sombre, crâne de verre)
function metal(g, x0, y0, x1, y1, a = 1) { const gr = g.createLinearGradient(x0, y0, x1, y1);
  gr.addColorStop(0, `rgba(58,62,74,${a})`); gr.addColorStop(.45, `rgba(26,28,36,${a})`); gr.addColorStop(1, `rgba(12,13,18,${a})`); return gr; }
function drawRobot(g, now, op, eyeCol, speak) {
  g.save(); g.globalAlpha = op;
  g.beginPath(); g.moveTo(520, 1180); g.lineTo(560, 900); g.bezierCurveTo(600, 830, 780, 790, 860, 790); g.lineTo(1060, 790);
  g.bezierCurveTo(1140, 790, 1320, 830, 1360, 900); g.lineTo(1400, 1180); g.closePath();
  g.fillStyle = metal(g, 0, 790, 0, 1180); g.fill(); g.strokeStyle = "rgba(160,170,190,.35)"; g.lineWidth = 1.5; g.stroke();
  g.strokeStyle = "rgba(160,170,190,.14)"; g.lineWidth = 1;
  for (const [x0, x1] of [[700, 780], [1140, 1220]]) { g.beginPath(); g.moveTo(x0, 850); g.lineTo(x1, 1080); g.stroke(); }
  g.beginPath(); g.moveTo(760, 980); g.lineTo(1160, 980); g.stroke();
  const core = .45 + .55 * speak, cg = g.createRadialGradient(960, 900, 2, 960, 900, 70);
  cg.addColorStop(0, `rgba(${eyeCol},${core})`); cg.addColorStop(1, `rgba(${eyeCol},0)`); g.fillStyle = cg; g.beginPath(); g.arc(960, 900, 70, 0, 7); g.fill();
  g.strokeStyle = `rgba(${eyeCol},.7)`; g.lineWidth = 2; g.beginPath(); g.arc(960, 900, 26, 0, 7); g.stroke();
  g.fillStyle = metal(g, 890, 0, 1030, 0); g.fillRect(895, 690, 130, 110);
  g.strokeStyle = "rgba(160,170,190,.3)"; for (let y = 700; y < 800; y += 14) { g.beginPath(); g.moveTo(895, y); g.lineTo(1025, y); g.stroke(); }
  g.strokeStyle = "rgba(90,96,110,.9)"; g.lineWidth = 7;
  for (const [a, b, c, d] of [[905, 700, 840, 760], [1015, 700, 1080, 760]]) { g.beginPath(); g.moveTo(a, b); g.quadraticCurveTo(c, d - 10, c - (a < 960 ? 40 : -40), d + 40); g.stroke(); }
  g.fillStyle = "#0b0c10"; g.beginPath(); g.arc(PORT.x, PORT.y, 13, 0, 7); g.fill();
  g.strokeStyle = "rgba(200,205,215,.8)"; g.lineWidth = 2; g.beginPath(); g.arc(PORT.x, PORT.y, 13, 0, 7); g.stroke();
  const shell = new Path2D();
  shell.ellipse(960, 400, 300, 320, 0, Math.PI, 0); shell.lineTo(1258, 560);
  shell.bezierCurveTo(1250, 640, 1170, 700, 1080, 705); shell.lineTo(840, 705); shell.bezierCurveTo(750, 700, 670, 640, 662, 560); shell.closePath();
  g.fillStyle = metal(g, 660, 90, 1260, 705); g.fill(shell); g.strokeStyle = "rgba(190,198,215,.45)"; g.lineWidth = 2; g.stroke(shell);
  for (const x of [652, 1268]) { g.fillStyle = metal(g, x - 45, 430, x + 45, 520); g.beginPath(); g.ellipse(x, 470, 34, 58, 0, 0, 7); g.fill();
    g.strokeStyle = `rgba(${eyeCol},${.35 + .4 * speak})`; g.lineWidth = 2; g.beginPath(); g.ellipse(x, 470, 18, 34, 0, 0, 7); g.stroke(); }
  g.strokeStyle = "rgba(190,198,215,.6)"; g.lineWidth = 2; g.beginPath(); g.moveTo(1268, 412); g.lineTo(1300, 300); g.stroke();
  g.fillStyle = `rgba(${eyeCol},${.6 + .4 * Math.sin(now * 3)})`; g.beginPath(); g.arc(1300, 296, 6, 0, 7); g.fill();
  g.fillStyle = "#07080b"; g.beginPath(); g.roundRect(740, 556, 440, 62, 30); g.fill();
  const blink = (now % 5.3) < .14 ? .15 : 1;
  for (const x of [880, 1040]) { const eg = g.createRadialGradient(x, 587, 1, x, 587, 60); eg.addColorStop(0, `rgba(${eyeCol},${.95 * blink})`); eg.addColorStop(1, `rgba(${eyeCol},0)`);
    g.fillStyle = eg; g.beginPath(); g.ellipse(x, 587, 60, 22 * blink, 0, 0, 7); g.fill();
    g.fillStyle = `rgba(255,255,255,${.9 * blink})`; g.beginPath(); g.ellipse(x, 587, 26, 6 * blink, 0, 0, 7); g.fill(); }
  for (let i = 0; i < 5; i++) { const w = 130 - Math.abs(i - 2) * 22; g.fillStyle = `rgba(${eyeCol},${.12 + .85 * speak * (.6 + .4 * Math.sin(now * 20 + i))})`;
    g.beginPath(); g.roundRect(960 - w / 2, 640 + i * 9, w, 4, 2); g.fill(); }
  g.restore();
}

// ------------------------------------------------------------ la seringue : arrive, se branche, injecte toute la dose, repart au début de l'expérience
function drawSyringe(g, cam, W, H, now, t, out, col) {
  if (drug === "neutral" || t <= 0 || out >= 1) return;
  const base = cam.base, appear = smooth(t / IV_IN), push = smooth((t - IV_IN) / IV_PUSH), away = smooth(out), sc = base;
  const sx = cam.X(420) - 120 * base * away, sy = cam.Y(180), bw = 78 * sc, bh = 330 * sc, x0 = sx - bw / 2, y0 = sy, tipY = y0 + bh + 60 * sc;
  g.save(); g.globalAlpha = Math.min(appear * 1.4, 1 - away);
  g.strokeStyle = "rgba(160,170,190,.35)"; g.lineWidth = 2; g.beginPath(); g.moveTo(sx, y0 - 70 * sc); g.lineTo(sx, y0 - 10 * sc); g.stroke();
  const left = 1 - push, liqTop = y0 + bh * (1 - left);
  const lg = g.createLinearGradient(0, liqTop, 0, y0 + bh); lg.addColorStop(0, `rgba(${col},.95)`); lg.addColorStop(1, `rgba(${col},.55)`);
  g.fillStyle = lg; g.fillRect(x0 + 4, liqTop, bw - 8, Math.max(0, y0 + bh - liqTop));
  g.fillStyle = "rgba(220,225,235,.92)"; g.fillRect(x0 + 2, liqTop - 10 * sc, bw - 4, 10 * sc);
  g.fillStyle = "rgba(160,170,190,.8)"; g.fillRect(sx - 5 * sc, y0 - 40 * sc + bh * push, 10 * sc, liqTop - (y0 - 40 * sc + bh * push));
  g.fillRect(sx - 34 * sc, y0 - 46 * sc + bh * push, 68 * sc, 8 * sc);
  g.strokeStyle = "rgba(225,230,240,.85)"; g.lineWidth = 1.6; g.beginPath(); g.roundRect(x0, y0, bw, bh, 6 * sc); g.stroke();
  for (let i = 1; i < 10; i++) { const y = y0 + bh * i / 10; g.beginPath(); g.moveTo(x0, y); g.lineTo(x0 + (i % 5 ? 14 : 26) * sc, y); g.stroke(); }
  g.beginPath(); g.moveTo(sx, y0 + bh); g.lineTo(sx, tipY); g.stroke();
  const px = cam.X(PORT.x), py = cam.Y(PORT.y), reach = smooth((t - IV_IN * .35) / (IV_IN * .65));
  const P = (u) => { const a = [sx, tipY], b = [sx, tipY + 260 * sc], c = [px - 260 * base, py + 120 * base], d = [px, py], v = 1 - u;
    return [0, 1].map(k => v * v * v * a[k] + 3 * v * v * u * b[k] + 3 * v * u * u * c[k] + u * u * u * d[k]); };
  g.strokeStyle = "rgba(230,232,240,.55)"; g.lineWidth = 3 * base; g.beginPath();
  for (let i = 0; i <= 120 * reach; i++) { const [x, y] = P(i / 120); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
  if (push > 0 && push < 1) for (let j = 0; j < 8; j++) { const u = ((now * .55) + j / 8) % 1, [x, y] = P(u);   // la drogue circule
    g.fillStyle = `rgba(${col},.95)`; g.beginPath(); g.arc(x, y, 5 * base, 0, 7); g.fill(); }
  if (push >= 1 && t < IV_IN + IV_PUSH + .5) { g.fillStyle = `rgba(${col},${Math.max(0, 1 - (t - IV_IN - IV_PUSH) * 2)})`; g.beginPath(); g.arc(px, py, 34 * base, 0, 7); g.fill(); }
  g.restore();
}

// ------------------------------------------------------------ fenêtre de la vidéo : crâne de verre, puis bordures vivantes
const ORG = {N: 240, reach: 0, lastWord: null};
function rayRect(th, hw, hh) { const c = Math.abs(Math.cos(th)), s = Math.abs(Math.sin(th)); return Math.min(c > 1e-6 ? hw / c : 1e9, s > 1e-6 ? hh / s : 1e9); }
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
function videoWindow(cam, W, H, m, now, dt) {
  const org = $("#organism"), dc = [cam.X(DOME.x), cam.Y(DOME.y)], drx = DOME.rx * cam.s, dry = DOME.ry * cam.s;
  const R = {cx: W * .43, cy: H * .53, hw: W * .31, hh: H * .40}, c = [lerp(dc[0], R.cx, m), lerp(dc[1], R.cy, m)];
  const k = Math.min(1.3, Math.abs(LA)), pos = LA >= 0, lsd = drug === "lsd", kk = drug === "neutral" ? 0 : Math.min(1, k);
  const last = $("#out").lastElementChild; if (last !== ORG.lastWord) { ORG.lastWord = last; ORG.reach = 1; } ORG.reach *= Math.exp(-dt / 2.2);
  const targets = []; if (last) { const r = last.getBoundingClientRect(); if (r.width) { const tx = r.left + r.width / 2 - c[0], ty = r.top + r.height / 2 - c[1];
    targets.push({a: Math.atan2(ty, tx), d: Math.hypot(tx, ty), w: .35 + .65 * ORG.reach}); } }
  const beat = Math.pow(Math.max(0, Math.sin(now * Math.PI * 2 * 1.15)), 6), pts = [];
  for (let i = 0; i < ORG.N; i++) {
    const th = i / ORG.N * Math.PI * 2, u = [Math.cos(th), Math.sin(th)];
    const base = lerp(1 / Math.hypot(u[0] / drx, u[1] / dry) * (1 + .012 * Math.sin(now * 1.1)), rayRect(th, R.hw, R.hh), m);
    let r = base;
    if (kk > 0 && pos) { let h = .035 * Math.sin(now * .5) + .3 * energy;
      if (lsd) { for (let n = 3; n <= 13; n += 2) h += (.13 / Math.sqrt(n)) * Math.sin(n * th + now * (.35 + .1 * n) + n * 1.3); h += .11 * Math.sin(6 * th - now * .6) * (.6 + .4 * Math.sin(now * .3)); }
      else h += .04 * Math.sin(2 * th + now * .35) + .16 * beat;
      let live = base * (1 + h);
      for (const t of targets) { const sig = lsd ? .05 : .3; live += Math.max(0, t.d - base) * (lsd ? .5 : .3) * t.w * Math.exp(-(angDiff(th, t.a) ** 2) / (2 * sig * sig)); }
      r = lerp(base, live, kk * Math.max(.35, m)); }
    else if (kk > 0) { const sides = 7, seg = Math.PI * 2 / sides, a0 = ((th % seg) + seg) % seg - seg / 2; r = lerp(base, base * .88 * Math.cos(seg / 2) / Math.cos(a0), kk); }
    pts.push([c[0] + u[0] * r, c[1] + u[1] * r]);
  }
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  Object.assign(org.style, {left: x0 + "px", top: y0 + "px", width: x1 - x0 + "px", height: y1 - y0 + "px"});
  org.style.clipPath = `path("M${pts.map(([x, y]) => (x - x0).toFixed(1) + " " + (y - y0).toFixed(1)).join(" L")} Z")`;
  org.style.filter = !pos && kk > 0 ? `grayscale(${kk * .8}) brightness(${1 - .25 * kk})` : lsd && kk > 0 ? `hue-rotate(${(Math.sin(now * .25) * 70 * kk).toFixed(1)}deg) saturate(${1 + .6 * kk})`
    : kk > 0 ? `sepia(${.25 * kk}) saturate(${1 + .3 * kk}) hue-rotate(${-15 * kk}deg)` : "";
  return {pts, c, kk, pos, lsd, beat};
}
function drawMembrane(g, win, now, m) {
  const {pts, c, kk, pos, lsd, beat} = win;
  const ring = (sc) => { g.beginPath(); pts.forEach(([x, y], i) => { const X = c[0] + (x - c[0]) * sc, Y = c[1] + (y - c[1]) * sc; i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); g.closePath(); };
  if (m < 1) { g.strokeStyle = `rgba(210,220,240,${.55 * (1 - m)})`; g.lineWidth = 2; ring(1); g.stroke(); }   // le verre du crâne
  if (kk < .02) return;
  if (pos && lsd) { const h0 = (now * 40) % 360;
    for (const [sc, al] of [[1.10, .18], [1.05, .35], [1, .9]]) { g.strokeStyle = `hsla(${(h0 + sc * 300) % 360} 95% 65% / ${al * kk})`; g.lineWidth = sc === 1 ? 2.5 : 1.5;
      g.shadowColor = `hsla(${h0} 100% 70% / ${kk})`; g.shadowBlur = sc === 1 ? 22 : 8; ring(sc); g.stroke(); } }
  else if (pos) { g.strokeStyle = `rgba(255,150,190,${(.6 + .4 * beat) * kk})`; g.lineWidth = 4 + 9 * beat; g.shadowColor = "rgba(255,90,160,.95)"; g.shadowBlur = 34 + 40 * beat; ring(1); g.stroke(); }
  else { g.strokeStyle = `rgba(170,180,190,${.6 * kk})`; g.lineWidth = 1; ring(1); g.stroke(); }
  g.shadowBlur = 0;
}

// ------------------------------------------------------------ mots du J-space de l'image en cours (fiche du run), sur la vidéo
let jsSlice = null;
const hash = (w) => { let h = 0; for (const ch of w) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); };
function jspace(now) {
  const box = $("#jspace"), sl = sliceAt(clock);
  if (sl !== jsSlice) { jsSlice = sl; const keep = new Set(sl.words.map(w => w[0]));
    [...box.children].forEach(s => { if (!keep.has(s.textContent)) { s.style.opacity = 0; setTimeout(() => s.remove(), 450); } });
    sl.words.forEach(([w, p], j) => { let s = [...box.children].find(x => x.textContent === w && x.style.opacity !== "0");
      if (!s) { s = document.createElement("span"); s.textContent = w; s.style.opacity = 0; box.appendChild(s); requestAnimationFrame(() => s.style.opacity = 1); } s._w = p; s._r = j; }); }
  const W = box.clientWidth, H = box.clientHeight, mx = Math.max(.01, ...sl.words.map(w => w[1])), k = drug === "neutral" ? 0 : Math.min(1, Math.abs(LA)), st = TYPO.state();
  [...box.children].forEach(s => { const w = (s._w || .01) / mx, h = hash(s.textContent), j = s._r || 0;
    const x0 = W * .05, y0 = H * .92 - j * H * .066, x1 = W * (.08 + .76 * ((h % 997) / 997)) + Math.sin(now * .3 + h) * 30 * k, y1 = H * (.12 + .74 * (((h >> 10) % 991) / 991));
    s.style.left = lerp(x0, x1, k) + "px"; s.style.top = lerp(y0, y1, k) + "px";
    s.style.fontSize = lerp(13 + 15 * w, (20 + 54 * w) * (.8 + .25 * Math.sin(now * .8 + j)), k) + "px";
    s.style.transform = `rotate(${(((h >> 4) % 61) - 30) * k}deg)`; s.style.fontVariationSettings = `'wght' ${(300 + 520 * w).toFixed(0)}, 'opsz' 36`;
    s.style.color = k < .05 ? `rgba(255,255,255,${.55 + .4 * w})` : `hsl(${(st.hue + (h % 120) * k + st.huespin * now) % 360} ${Math.max(40, st.sat)}% ${70 + 15 * w}%)`; });
}

// ------------------------------------------------------------ texte écrit par le robot
function addWord(i, st) {
  const w = E.words[i], out = $("#out");
  for (let n = 0; n < w.nl; n++) out.appendChild(document.createElement("br"));
  const el = document.createElement("span"); el.className = "w"; [...w.w].forEach(ch => { const c = document.createElement("span"); c.textContent = ch; el.appendChild(c); });
  out.appendChild(el); TYPO.birth(el, i, st, clock); $("#output").scrollTop = $("#output").scrollHeight;
}
function styleOutput() { const basePx = parseFloat(getComputedStyle($("#out")).fontSize), box = $("#output");
  for (const el of $("#out").children) { if (!el.classList.contains("w") || el._done) continue; TYPO.style(el, clock, {ent: .5, box, basePx}); if (TYPO.still(el, clock)) el._done = true; } }

// ------------------------------------------------------------ boucle
function frame(nowMs) {
  const dt = Math.min(.1, (nowMs - last) / 1000); last = nowMs;
  if (!paused) step(dt, nowMs / 1000);
  requestAnimationFrame(frame);
}
let anim = 0;  // horloge d'animation (s'arrête en pause)
function step(dt, _) {
  anim += dt; const now = anim;
  if (phase === "prompt" || phase === "iv") {
    pre += dt;
    const q = E ? E.prompt : "", ctx = E ? E.ctx : "", total = q.length + ctx.length, nq = Math.floor(Math.max(0, pre - .9) / 4.2 * total);
    $("#prompt .q").innerHTML = q.slice(0, nq) + (nq < total ? '<span class="caret"></span>' : "");
    $("#prompt .ctx").textContent = nq > q.length ? ctx.slice(0, nq - q.length) : "";
    if (phase === "prompt" && pre >= PRE_PROMPT) { if (drug === "neutral") startLive(); else phase = "iv"; }
    else if (phase === "iv" && pre >= PRE_PROMPT + ivTotal()) startLive();
  }
  if (phase === "live") { const s = sounding(), v = $("#organism video"); clock = s.currentTime; if (s !== v && Math.abs(v.currentTime - clock) > .15) v.currentTime = clock;
    if (s.ended) phase = "end"; }
  const a = phase === "live" || phase === "end" ? alphaAt(clock) : 0;
  LA += (a - LA) * (1 - Math.exp(-dt / 1.2));
  TYPO.update(a, dt); const st = TYPO.state();
  if (phase === "live") { while (idx < E.words.length && E.words[idx].t <= clock) addWord(idx++, st); $("#output").style.opacity = 1; }
  if (analyser) { analyser.getByteFrequencyData(fbins); let s = 0; for (let i = 2; i < 120; i++) s += fbins[i]; energy += ((s / 118 / 255) - energy) * (1 - Math.exp(-dt / .1)); }
  const live = phase === "live" || phase === "end", m = live ? smooth((clock - ZOOM_AT) / ZOOM_DUR) : 0;
  const [g, W, H] = fit($("#stage")), cam = camera(m, W, H), col = DRUGCOL[drug].join(","), eyeCol = drug === "neutral" ? "170,220,255" : col;
  g.fillStyle = "#06070a"; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 140; i++) { const x = ((i * 137.5 + now * (6 + 20 * Math.abs(LA)) * (1 + i % 3)) % (W + 40)) - 20, y = (i * 71.3) % H;
    g.fillStyle = `rgba(${drug === "neutral" ? "160,170,190" : col},${.08 + .12 * Math.abs(LA) * ((i % 5) / 4)})`; g.fillRect(x, y, 1.5, 1.5); }
  const robotOp = phase === "idle" ? 0 : live ? 1 : smooth(pre / 1.2);
  cam.apply(g); drawRobot(g, now, robotOp, eyeCol, live ? energy * 1.6 : 0); g.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const ivT = phase === "iv" ? pre - PRE_PROMPT : live ? ivTotal() + clock : 0;
  drawSyringe(g, cam, W, H, now, ivT, live ? clock / 1.5 : 0, col);
  $("#organism").style.display = E && phase !== "idle" ? "block" : "none";
  const [fg] = fit($("#fx")); fg.clearRect(0, 0, W, H);
  if (E && phase !== "idle") {
    const win = videoWindow(cam, W, H, m, now, dt);
    $("#organism").style.opacity = live ? 1 : .3 * robotOp;   // avant l'expérience : vidéo en veille dans le crâne
    drawMembrane(fg, win, now, m);
    if (live) { const r = $("#output").getBoundingClientRect(), mx = cam.X(960), my = cam.Y(660);   // le robot parle : fil de lumière vers son texte
      fg.strokeStyle = `rgba(${eyeCol},${.15 + .5 * energy})`; fg.lineWidth = 1.2; fg.beginPath(); fg.moveTo(mx, my);
      fg.bezierCurveTo(mx + 220, my, r.left - 160, r.top + 60, r.left, r.top + 60); fg.stroke();
      jspace(now); $("#jspace").style.opacity = smooth(clock / 2.5); }
  }
  $("#prompt").style.opacity = live ? Math.max(0, 1 - clock / 1.6) : phase === "idle" ? 0 : 1;
  $("#output").style.background = drug === "neutral" || !live ? "rgba(6,7,10,.78)" : `hsla(${st.bg_hue} ${st.bg_sat}% ${Math.min(st.bg_light, 12)}% / .85)`;
  styleOutput();
}

// ------------------------------------------------------------ lecture, pause, remise à zéro
function audioGraph(el) {
  if (!actx) actx = new AudioContext();
  if (!sources.has(el)) { const src = actx.createMediaElementSource(el), an = actx.createAnalyser(); an.fftSize = 1024; src.connect(an); an.connect(actx.destination); sources.set(el, an); }
  analyser = sources.get(el); fbins = new Uint8Array(analyser.frequencyBinCount); actx.resume();
}
function startLive() {
  phase = "live"; clock = 0; const v = $("#organism video"), s = sounding();
  audioGraph(s); v.muted = s !== v; v.currentTime = 0; if (s !== v) s.currentTime = 0; v.play(); if (s !== v) s.play();
}
function setPaused(p) {
  paused = p; $("#paused").style.display = p ? "block" : "none";
  const v = $("#organism video"), s = sounding();
  if (phase === "live") { if (p) { v.pause(); s.pause(); } else { v.play(); s.play(); } }
}
async function start(d) {
  if (!EXPS[d]) return;
  drug = d; paused = false; $("#paused").style.display = "none";
  E = await (await fetch(`data/exp_${EXPS[d]}.json`)).json();
  const v = $("#organism video"), au = $("#audio"); v.pause(); au.pause();
  const [vu, aud] = await Promise.all([blobURL(E.video), E.audio ? blobURL(E.audio) : null]);
  if (v.dataset.src !== vu) { v.src = vu; v.dataset.src = vu; }
  if (aud && au.dataset.src !== aud) { au.src = aud; au.dataset.src = aud; }
  v.currentTime = 0; v.muted = true;
  phase = "prompt"; pre = 0; clock = 0; idx = 0; LA = 0; jsSlice = null;
  TYPO.setDrug(d); TYPO.reset(); $("#out").innerHTML = ""; $("#jspace").innerHTML = ""; $("#output").style.opacity = 0;
  document.querySelectorAll("#drugs button").forEach(b => b.classList.toggle("on", b.dataset.drug === d));
}

(async () => {
  EXPS = await (await fetch("data/experiences.json")).json();
  document.querySelectorAll("#drugs button").forEach(b => { b.disabled = !EXPS[b.dataset.drug];
    b.onclick = () => { if (!actx) actx = new AudioContext(); start(b.dataset.drug); }; });
  addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); if (phase !== "idle") setPaused(!paused); }
    else if (e.key === "Enter") { e.preventDefault(); if (EXPS[drug] && phase !== "idle") start(drug); }   // on recommence depuis le début
  });
  requestAnimationFrame((n) => { last = n; requestAnimationFrame(frame); });
})();
</script>
